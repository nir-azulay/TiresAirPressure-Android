name: Android Play internal

on:
  # The monthly schedule still runs from TiresAirPressureManagement, where the
  # Play upload secrets are stored. Enable it here after those secrets are copied.
  workflow_dispatch:

concurrency:
  group: android-play
  cancel-in-progress: false

env:
  # versionCode is BUILD_NUMBER_BASE + the workflow run number. Raise the base
  # if Play already has a higher versionCode.
  BUILD_NUMBER_BASE: "662"

jobs:
  play:
    name: Build and upload to Play internal testing
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute version code
        run: echo "BUILD_NUMBER=$((BUILD_NUMBER_BASE + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Stage upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set. See docs/android-play-ci.md."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build release bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ./gradlew bundleRelease --no-daemon -PversionBuildOverride="$BUILD_NUMBER"

      - name: Upload release bundle
        uses: actions/upload-artifact@v5
        with:
          name: android-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
          if-no-files-found: error

      - name: Publish to Play internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.nazulay.tiresairpressuremanagement
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
