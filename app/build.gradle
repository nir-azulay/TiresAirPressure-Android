plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

// Version management
def versionPropsFile = file('version.properties')
def versionBuild = 642

if (versionPropsFile.canRead()) {
    def versionProps = new Properties()
    versionProps.load(new FileInputStream(versionPropsFile))
    versionBuild = versionProps['VERSION_BUILD'].toInteger()
}

def versionMajor = 1
def versionMinor = 3
def versionPatch = 7

// Increment build number
versionBuild++

// Save new build number
def versionProps = new Properties()
versionProps['VERSION_BUILD'] = versionBuild.toString()
versionProps.store(versionPropsFile.newWriter(), null)

// Create full version string
def fullVersionName = "${versionMajor}.${versionMinor}.${versionPatch}.${versionBuild}"

android {
    namespace 'com.nazulay.tiresairpressuremanagement'
    compileSdk 35

    defaultConfig {
        applicationId "com.nazulay.tiresairpressuremanagement"
        minSdk 34
        targetSdk 35
        versionCode versionBuild
        versionName "${versionMajor}.${versionMinor}.${versionPatch}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        buildConfigField "String", "BUILD_TIME", "\"${new Date().format('yyyy-MM-dd HH:mm:ss')}\""
        buildConfigField "String", "VERSION_NAME", "\"${fullVersionName}\""
        buildConfigField "int", "MIN_SDK_VERSION", "34"
        buildConfigField "int", "TARGET_SDK_VERSION", "35"
        
        manifestPlaceholders = [
            // BLE permissions
            permissionBluetooth: true,
            permissionBluetoothAdmin: true,
            permissionBluetoothScan: true,
            permissionBluetoothConnect: true,
            permissionBluetoothAdvertise: true,
            
            // Location permissions
            permissionLocation: true,
            permissionFineLocation: true,
            permissionCoarseLocation: true,
            permissionBackgroundLocation: true,
            
            // Notification permissions
            permissionNotifications: true,
            permissionVibrate: true,
            
            // Foreground service permissions
            permissionForegroundService: true,
            permissionForegroundServiceConnectedDevice: true,
            permissionWakeLock: true,
            
            // Internet permissions
            permissionInternet: true,
            permissionNetworkState: true,
            
            // WiFi permissions
            permissionWifiState: true,
            permissionWifiStateChange: true
        ]
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "boolean", "DEBUG_MODE", "false"
            buildConfigField "String", "BUILD_TYPE", "\"RELEASE\""
        }
        debug {
            buildConfigField "boolean", "DEBUG_MODE", "true"
            buildConfigField "String", "BUILD_TYPE", "\"DEBUG\""
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2023.10.00')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    
    // Material Design 3
    implementation 'androidx.compose.material3:material3:1.2.0'
    implementation 'com.google.android.material:material:1.11.0'
    
    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    
    // Moshi for JSON
    implementation 'com.squareup.moshi:moshi-kotlin:1.15.0'
    ksp 'com.squareup.moshi:moshi-kotlin-codegen:1.15.0'
    
    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    
    // BLE
    implementation 'no.nordicsemi.android:ble:2.7.2'
    
    // Android Auto
    implementation 'androidx.car.app:app:1.4.0'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
} 